# CI — GUARD-09's four-target matrix, GUARD-12's toolchain pin, GUARD-01's
# licence gate, and the guardrail proof.
#
# D-16 requires EVERYTHING on all four targets on every PR — not a reduced
# golden-hash-only job on the non-Linux runners. A matrix that only builds
# everywhere and only tests in one place does not support a byte-identity claim.
#
# The golden-fixture comparison this matrix exists to run landed in plan 01-08
# and has its own named step below, so the byte-identity claim is legible in the
# log rather than buried inside the general `cargo test` line. It is offline by
# construction — no reference binary, no container — which is what lets it run
# on all four targets rather than only on Linux (CONF-10).
#
# ---------------------------------------------------------------------------
# Runner availability fallback (D-16's known operational risk)
# ---------------------------------------------------------------------------
# `macos-13`, GitHub's last x86_64 macOS image, is retired. The matrix therefore
# uses the first fallback below rather than silently shrinking to three targets:
#
#   1. Build for x86_64-apple-darwin on an arm64 runner and execute the test
#      binaries under Rosetta 2. This preserves the actual x86_64 code path,
#      which is the thing the byte-identity claim is about — cross-compiling
#      and not running would reduce this entry to a compile check.
#
#   2. If Rosetta 2 is unavailable on hosted runners, drop to three targets AND
#      record the reduction and its reason as a waiver in CONFORMANCE-GATE.md.
#      A matrix that quietly went from four entries to three is indistinguishable
#      from a matrix nobody maintains.
#
# This block is written down now, before the retirement, so it is a decision
# rather than a red gate discovered on a Monday.

name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  matrix:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            test_runner: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            test_runner: arch -x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test_runner: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test_runner: ""

    # Cargo applies this only when it executes x86_64-apple-darwin binaries.
    # The other three targets ignore the target-specific variable. This makes
    # the Rosetta route explicit rather than relying on macOS to translate an
    # x86_64 test binary implicitly.
    env:
      CARGO_TARGET_X86_64_APPLE_DARWIN_RUNNER: ${{ matrix.test_runner }}

    steps:
      # GitHub's Windows image defaults to CRLF checkout conversion. The golden
      # dump is an exact text artifact, so preserve its committed LF bytes just
      # as Linux and macOS do. This runs before checkout intentionally.
      - name: Preserve committed line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install and verify Rosetta 2 for x86_64 execution
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          test "$(arch -x86_64 /usr/bin/uname -m)" = "x86_64"

      # No toolchain-installer action, deliberately. Every such action wants the
      # channel as an input, which restates the pin that `rust-toolchain.toml`
      # already owns — and two copies of a pin drift. The runners ship rustup,
      # which reads `rust-toolchain.toml` and installs the pinned channel, its
      # components and its targets on the first cargo invocation. One source of
      # truth (GUARD-12).
      - name: Show the toolchain rustup resolved
        shell: bash
        run: |
          rustup show
          rustc --version --verbose
          cargo --version

      - name: Assert the running toolchain is the pinned one (GUARD-12)
        shell: bash
        run: |
          pinned=$(grep -E '^[[:space:]]*channel[[:space:]]*=' rust-toolchain.toml \
                   | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          actual=$(rustc --version | awk '{print $2}')
          if [ "$pinned" != "$actual" ]; then
            echo "toolchain drift: rust-toolchain.toml pins $pinned but rustc reports $actual" >&2
            exit 1
          fi
          echo "toolchain $actual matches rust-toolchain.toml"

      - name: Build
        run: cargo build --locked --all-targets --target ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Replay permanent fuzz corpus on stable
        run: >
          cargo test --locked --features fuzzing --target ${{ matrix.target }}
          --test fuzz_regression

      # GUARD-09 and GUARD-10, as their own step. The general `cargo test` above
      # already runs these targets; naming them separately is what makes a
      # four-target byte-identity failure obvious in the log instead of one line
      # among two hundred. If this step is red and the one above is green, the
      # crate builds everywhere and produces DIFFERENT BYTES somewhere — look
      # for a hashed container, a platform-dependent sort, or a float.
      #
      # `IAMF_REF_DECODER` is never set in this job, deliberately: the golden
      # layer must be green with no reference binary present, which is what puts
      # it in CONF-10's always-on layer. It is not exported to empty either —
      # an empty path is not "unset", and the harness treats it as unset only
      # because `reference_decoder()` was hardened to, not because a workflow
      # can be relied on to get that distinction right.
      - name: Golden fixture reproduces on this target (GUARD-09, GUARD-10)
        run: >
          cargo test --locked --target ${{ matrix.target }}
          --test golden --test fixture

      # D-02: "dependency-free" means zero LINKED dependencies. Plain
      # `cargo tree -e normal` includes proc-macro edges and would show the whole
      # derive chain, so it is the wrong instrument.
      - name: Assert the linked dependency graph is iamf + thiserror only (D-02)
        shell: bash
        run: |
          graph=$(cargo tree -e normal,no-proc-macro --prefix none \
                  | awk 'NF {print $1}' | sort -u)
          echo "$graph"
          expected=$(printf 'iamf\nthiserror\n')
          if [ "$graph" != "$expected" ]; then
            echo "linked dependency graph changed — see D-02 in REFERENCES.md" >&2
            exit 1
          fi

  # GUARD-01 and the guardrail proof. Linux only: both are host-independent
  # policy checks, and running them four times would only prove that four
  # runners can read the same TOML file.
  guardrails:
    name: licence gate + guardrail proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show the toolchain rustup resolved
        run: rustup show

      # Pinned to the exact version the policy was authored and verified
      # against. cargo-deny's `[licenses]` schema has changed incompatibly
      # before — the `deny`, `copyleft`, `allow-osi-fsf-free`, `default` and
      # `version` keys were removed and now error — so an unpinned tool is a
      # future red gate with a confusing message.
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny --all-features check

      - name: cargo deny check (isolated fuzz workspace)
        run: >
          cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml
          --all-features check

      - name: Assert libFuzzer remains outside the root lock and linked graph
        shell: bash
        run: |
          if grep -q '^name = "libfuzzer-sys"$' Cargo.lock; then
            echo "libfuzzer-sys leaked into the root Cargo.lock" >&2
            exit 1
          fi
          graph=$(cargo tree --locked -e normal,no-proc-macro --prefix none)
          echo "$graph"
          if grep -q 'libfuzzer' <<<"$graph"; then
            echo "libFuzzer leaked into the root default linked graph" >&2
            exit 1
          fi

      # A guardrail that is configured and a guardrail that fires are different
      # things. This step introduces six deliberate violations and asserts each
      # gate rejects them by name, so a silently disabled lint turns the build
      # red and says which one.
      - name: Prove every guardrail still bites
        run: bash tools/prove-guards.sh
