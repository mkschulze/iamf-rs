[package]
name = "iamf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "IAMF (Immersive Audio Model and Formats) OBU serialiser, parser and descriptor model"
repository = "https://github.com/mkschulze/iamf-rs"
readme = "README.md"
keywords = ["iamf", "audio", "bitstream", "spatial-audio", "aom"]
categories = ["encoding", "multimedia::audio"]

[workspace]
members = ["."]
exclude = ["fuzz", "tools/codec-fixtures"]

# Every dependency states its licence on the line that adds it (CLAUDE.md
# Constraints). Phase 1's shipping graph is exactly one crate: `thiserror` is
# unconditional per PROJECT.md ("never `anyhow` in a library"), and D-02 defines
# "dependency-free" as zero *linked* dependencies — `thiserror-impl -> syn ->
# proc-macro2 -> quote -> unicode-ident` is proc-macro-only and contributes no
# code to the linked artifact. `cargo tree -e normal` is the check.
#
# `bitstream-io` is deliberately NOT here: D-01 demotes it to a dev-dependency
# used only as a differential oracle (arrives in plan 01-03).
[dependencies]
thiserror = "2.0.20" # MIT OR Apache-2.0
arbitrary = { version = "1.4.2", optional = true } # MIT OR Apache-2.0 — bounded structured fuzz input only

[features]
default = []
fuzzing = ["dep:arbitrary"]

# Dev-only, and none of these reach the linked graph — `cargo tree -e
# normal,no-proc-macro` is the instrument that proves it (plain `-e normal`
# includes proc-macro edges and reports a false positive).
#
# `bitstream-io` is a DEV-dependency and nothing else (D-01). It is the
# differential oracle `tests/bits_oracle.rs` cross-checks the hand-rolled
# BitCursor/BitWriter against; importing it from `src/` would reintroduce the
# error-mapping boundary BITS-07 exists to remove and destroy the native byte
# offsets every `Error.at` value flows from. A verify gate greps `src/` for it.
[dev-dependencies]
hex-literal = "1.1.0"   # MIT OR Apache-2.0 — hand-computed vectors (BITS-06, D-25)
proptest = "1.11.0"     # MIT OR Apache-2.0 — differential oracle (D-01); MSRV 1.85, exactly GUARD-12's floor
bitstream-io = "4.10.0" # MIT/Apache-2.0 (slash form; cargo-deny 0.20.2 resolves it as OR) — the oracle itself
sha2 = "0.10.9"         # MIT OR Apache-2.0 — GUARD-09's golden digest (D-20), dev-only
syn = { version = "2.0.119", features = ["full", "visit"] } # MIT OR Apache-2.0 — CODEC-07 AST oracle
toml = "0.8.23" # MIT OR Apache-2.0 — CODEC-07 manifest/lock oracle

[[test]]
name = "fuzz_regression"
path = "tests/fuzz_regression.rs"
required-features = ["fuzzing"]

# Why `sha2` and not a platform tool: GUARD-09 runs the golden test on all four
# targets including `x86_64-pc-windows-msvc`, where neither `shasum` nor
# `sha256sum` exists, so a `Command`-based digest would silently reduce the
# matrix to three. Why not hand-rolled: a hand-rolled digest is a second thing
# that can be wrong inside a test whose only job is to detect change. It is a
# change-detection digest, not a security boundary, and it reaches nothing
# shipped — `cargo tree -e normal,no-proc-macro` still lists exactly `iamf` and
# `thiserror`.

# Phase 2 adds only the `fuzzing` feature. It exposes the bounded structural
# generator and its optional `arbitrary` dependency to the excluded fuzz
# workspace; default production builds retain Phase 1's linked graph.

[lints.rust]
# Phase 1 has no FFI and never will need one; `forbid` (not `deny`) so no
# module can re-enable it locally. Restated in `src/lib.rs` for readers who
# never open the manifest.
unsafe_code = "forbid"

# GUARD-03 / GUARD-04. These are the lints people disable first, which is why
# they live in the manifest (workspace-wide, every target) rather than as
# crate-root attributes that a new binary target would silently miss.
# The "outside tests" carve-out (GUARD-04) is expressed in `clippy.toml` via
# `allow-unwrap-in-tests` / `allow-expect-in-tests` / `allow-panic-in-tests`,
# not by `#[allow]` attributes in source.
[lints.clippy]
indexing_slicing = "deny"        # GUARD-03 — a parser meets hostile input by definition
arithmetic_side_effects = "deny" # GUARD-03 — every size field is attacker-controlled
unwrap_used = "deny"             # GUARD-04
expect_used = "deny"             # GUARD-04
panic = "deny"                   # GUARD-04 — never panic on malformed input
disallowed_types = "deny"        # GUARD-02 (HashMap/HashSet) + GUARD-11 (f32/f64), configured in clippy.toml
disallowed_methods = "deny"      # GUARD-11 (transcendentals), configured in clippy.toml
